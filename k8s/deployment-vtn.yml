# vtn — training environment ("อบรม"), same np cluster/ns staging as beta
# (see deployment-beta.yml), but its own Deployments so it never collides
# with beta's or prod's. Applied by the Jenkinsfile on every vtn run (see
# "Ensure vtn Deployments (vtn only)") — idempotent, so this is also the
# reference copy of what's live. Manual apply is only needed for a fresh
# cluster/namespace that's never run the vtn pipeline yet:
#
#   kubectl -n staging apply -f k8s/deployment-vtn.yml
#
# Differences from deployment-beta.yml:
# - Every Deployment/Service name is suffixed "-vtn" instead of no suffix,
#   so it can coexist with beta's un-suffixed np resources in the same ns.
# - image starts at "vcare-<svc>-latest" — the current PRODUCTION tag, no
#   "-beta" marker. vtn always tracks whatever's live in prod (see Rollout
#   in the Jenkinsfile) rather than building its own image.
# - envFrom points at vcare-<svc>-secret-vtn (own Secret, own DB/ThaiD
#   config — see k8s/secrets-vtn.yml, gitignored, applied by hand).
# - imagePullSecrets uses "vtnbackcred" instead of "betabackcred" — its own
#   pull secret so a vtn deploy doesn't depend on beta having run first.
# - case-service's uploads volume uses vcare-case-service-uploads-vtn-pvc
#   (k8s/case-service-storage-vtn.yml), its own uploads folder.
#
# case-service stays at 1 replica — same Alembic-migration-on-start
# constraint as everywhere else in this repo.

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: staging
  name: bff-vsmartcare-vtn
  labels:
    app: bff-vsmartcare-vtn
spec:
  selector:
    matchLabels:
      app: bff-vsmartcare-vtn
  template:
    metadata:
      labels:
        app: bff-vsmartcare-vtn
    spec:
      imagePullSecrets:
        - name: regcred
        - name: regcred-staging
        - name: vtnbackcred
      containers:
        - name: vcare-bff
          image: registry-vs.m-society.go.th/root/vcare-backend:vcare-bff-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: vcare-bff-secret-vtn
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: staging
  name: case-service-vtn
  labels:
    app: case-service-vtn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: case-service-vtn
  template:
    metadata:
      labels:
        app: case-service-vtn
    spec:
      imagePullSecrets:
        - name: regcred
        - name: regcred-staging
        - name: vtnbackcred
      containers:
        - name: vcare-case-service
          image: registry-vs.m-society.go.th/root/vcare-backend:vcare-case-service-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: vcare-case-service-secret-vtn
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads/welfare-evidence
              subPath: welfare-evidence
            - name: uploads
              mountPath: /app/uploads/file-payments
              subPath: file-payments
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: vcare-case-service-uploads-vtn-pvc
---
