# Mirrors what already exists on np (ns staging) — NOT applied by the
# Jenkinsfile beta path (see deployment-beta.yml header). Names match np's
# real Services exactly — no "vcare-" prefix, no "-beta" suffix.
#
# Only bff-vsmartcare is NodePort (31980, matching dev-np-quickstart.md §0/§4:
# the edge proxies /api-vsmartcare to this NodePort). The other five backend
# services are internal-only — ClusterIP :8000, reached through the bff, not
# the public edge (§4.1 diagram) — unlike the old ns vcare version where all
# six were NodePort with distinct ports (8000-8005 / 30810-30815); np has no
# reason to expose them individually since bff is the only public entry point.

apiVersion: v1
kind: Service
metadata:
  namespace: staging
  name: bff-vsmartcare
  labels:
    app: bff-vsmartcare
spec:
  selector:
    app: bff-vsmartcare
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 31980
  type: NodePort
---
