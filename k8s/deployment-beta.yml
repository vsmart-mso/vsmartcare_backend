apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: vcare
  name: vcare-bff-beta
  labels:
    app: vcare-bff-beta
spec:
  selector:
    matchLabels:
      app: vcare-bff-beta
  template:
    metadata:
      labels:
        app: vcare-bff-beta
    spec:
      imagePullSecrets:
        - name: staggingbackcred
      containers:
        - name: vcare-bff
          image: staging-registry-vs.m-society.go.th/root/vcare-backend:vcare-bff-beta-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: vcare-bff-secret-beta
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: vcare
  name: vcare-case-service-beta
  labels:
    app: vcare-case-service-beta
spec:
  selector:
    matchLabels:
      app: vcare-case-service-beta
  template:
    metadata:
      labels:
        app: vcare-case-service-beta
    spec:
      imagePullSecrets:
        - name: staggingbackcred
      containers:
        - name: vcare-case-service
          image: staging-registry-vs.m-society.go.th/root/vcare-backend:vcare-case-service-beta-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: vcare-case-service-secret-beta
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads/welfare-evidence
              subPath: welfare-evidence
            - name: uploads
              mountPath: /app/uploads/file-payments
              subPath: file-payments
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: vcare-case-service-uploads-beta-pvc
---
