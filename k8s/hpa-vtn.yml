# HPA for vtn (ns staging, np cluster) — mirrors hpa-np.yml (now including
# case-service, see that file's header for the accepted migration-race
# tradeoff this carries) but targets the "-vtn" suffixed Deployments so it
# never collides with beta's. Applied by the Jenkinsfile on every vtn run
# (see "Ensure vtn HPA (vtn only)").
#
# Requires metrics-server (or equivalent) in the cluster — same caveat as
# hpa-np.yml. If HPA shows "unknown" for CPU/memory targets via
# `kubectl -n staging get hpa`, that's what to check first.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: staging
  name: bff-vsmartcare-vtn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff-vsmartcare-vtn
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
