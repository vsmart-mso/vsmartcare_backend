# Beta-only storage, kept separate from k8s/case-service-storage.yml so beta
# uploads never land in the same NFS path as the main deployment.
# NFS server ต้อง setup ก่อนบนเครื่อง 172.21.103.131 (ดู NFS_SETUP.md)
# export path บนเครื่อง 131: /srv/nfs/vcare/case-service-beta/uploads
#   ซึ่งข้างในมี 2 โฟลเดอร์ย่อย: welfare-evidence, file-payments
# ทุก worker node ที่ vcare-case-service-beta อาจถูก schedule ไปลง ต้องลง nfs-common (Debian/Ubuntu)
# หรือ nfs-utils (RHEL/CentOS) ไม่งั้น mount จะ fail ตอน pod สร้าง

apiVersion: v1
kind: PersistentVolume
metadata:
  name: vcare-case-service-uploads-beta-pv
  labels:
    app: vcare-case-service-beta
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-manual
  nfs:
    server: 172.21.103.131
    path: /srv/nfs/vcare-beta/case-service/uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vcare-case-service-uploads-beta-pvc
  namespace: vcare
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-manual
  resources:
    requests:
      storage: 20Gi
  volumeName: vcare-case-service-uploads-beta-pv
