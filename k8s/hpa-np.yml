# HPA for np (ns staging) — mirrors k8s/hpa.yml (ns vcare), now including
# case-service, with np's real Deployment names (no "vcare-" prefix, no
# "-beta" suffix) and np-specific replica bounds.
#
# case-service now gets the same 2→3 scaling as k8s/hpa.yml (ns vcare) —
# deliberately matched to prod's existing behavior on request. Accepted
# risk: case-service's container runs `alembic upgrade head` on every
# start (see case-service/Dockerfile), with no explicit locking beyond
# whatever Alembic's own version table does — if a scale-up or rolling
# restart brings up multiple replicas at once right after a deploy that
# ships a new migration, they could race running that migration
# concurrently. Production already runs this same image at 2-3 replicas
# under this exact constraint, so beta is intentionally kept at parity
# rather than treated as more cautious than prod.
#
# The other five backend services (bff-vsmartcare, notification-service,
# ocr-service, thaid-auth-service, dashboard-service) are the ones
# dev-np-quickstart.md item 16 calls "stateless" and already runs at a fixed
# 2 replicas + podAntiAffinity on np — this HPA lets them scale 2→3 instead
# of staying fixed. Bounds/thresholds copied from k8s/hpa.yml for consistency
# with production's tuning.
#
# Requires metrics-server (or equivalent) in the cluster to have any effect —
# dev-np-quickstart.md implies `kubectl top` works on np, which needs it, but
# this hasn't been directly verified. If HPA shows "unknown" for CPU/memory
# targets via `kubectl -n staging get hpa`, that's what to check first.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: staging
  name: bff-vsmartcare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff-vsmartcare
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
